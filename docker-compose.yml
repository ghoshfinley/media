networks:
  media:
    driver: bridge
  # VPN-isolated services use network_mode: "service:vpn" instead of this network

volumes:
  # Media library lives on the Drobo NAS (SMB1 / Samba 3.4.4), mounted per-container
  # via CIFS so an unreachable Drobo fails loudly instead of exposing an empty library.
  drobo_tv:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.0.199/Music/media/tv"
      o: "guest,vers=1.0,uid=${PUID},gid=${PGID},file_mode=0664,dir_mode=0775,iocharset=utf8"
  drobo_movies:
    driver: local
    driver_opts:
      type: cifs
      device: "//192.168.0.199/Music/media/movies"
      o: "guest,vers=1.0,uid=${PUID},gid=${PGID},file_mode=0664,dir_mode=0775,iocharset=utf8"

services:
  vpn:
    image: ghcr.io/qdm12/gluetun:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - media
    ports:
      - "8090:8080"       # qBittorrent WebUI
      - "6881:6881"       # qBittorrent torrent port TCP
      - "6881:6881/udp"   # qBittorrent torrent port UDP
      - "9696:9696"       # Prowlarr
      - "8191:8191"       # FlareSolverr
      - "8000:8000"       # Gluetun HTTP API (for Homepage widget)
      - "8989:8989"       # Sonarr
      - "7878:7878"       # Radarr
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - BLOCK_IPV6=on
      - UPDATER_PERIOD=24h
      - VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
      - TZ=${TZ}
    volumes:
      - ./config/gluetun:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # --- VPN-isolated services ---
  # These share gluetun's network namespace — all traffic exits via the VPN tunnel.
  # They cannot be placed on named networks; ports are exposed via gluetun above.

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - QBT_PREFERENCES__WebUI__HostHeaderValidation=false
      - QBT_PREFERENCES__WebUI__CSRFProtection=false
    volumes:
      - ./config/qbittorrent:/config
      - ./media/downloads:/data/downloads
    restart: unless-stopped

  # Watches gluetun for tunnel (re)connects. On each one it restarts qBittorrent
  # (libtorrent wedges on the stale tun0 after a VPN flap) and pushes the new
  # ProtonVPN forwarded port into qBittorrent's listen port. Not in the VPN
  # namespace — it drives the other containers via the Docker socket.
  qbt-healer:
    image: docker:cli
    container_name: qbt-healer
    network_mode: none
    depends_on:
      - vpn
      - qbittorrent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -c
      - |
        sync_port() {
          i=0
          while [ $$i -lt 12 ]; do
            port=$$(docker exec vpn cat /tmp/gluetun/forwarded_port 2>/dev/null)
            if [ -n "$$port" ] && [ "$$port" != "0" ]; then
              docker exec qbittorrent curl -s -m 10 \
                -d "json={\"listen_port\":$$port,\"random_port\":false,\"upnp\":false}" \
                http://127.0.0.1:8080/api/v2/app/setPreferences >/dev/null 2>&1 \
                && echo "[qbt-healer] set listen_port=$$port" && return 0
            fi
            i=$$((i+1)); sleep 5
          done
          echo "[qbt-healer] no forwarded port available yet"
        }
        sleep 20
        echo "[qbt-healer] initial port sync"
        sync_port
        docker logs -f --since 0m vpn 2>&1 | while read l; do
          case "$$l" in
            *"wireguard setup is complete"*)
              echo "[qbt-healer] VPN tunnel up — restarting qbittorrent"
              docker restart qbittorrent >/dev/null
              sleep 15
              sync_port
              ;;
          esac
        done
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - ./media/downloads:/data/downloads
      - drobo_tv:/data/tv
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - ./media/downloads:/data/downloads
      - drobo_movies:/data/movies
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    # No PUID/PGID support — set the run-as user directly
    user: "${PUID}:${PGID}"
    # Share the VPN namespace so localhost:7878 reaches Radarr (same as the arr apps)
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=@daily
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config            # app data / cached TRaSH guides (gitignored)
      - ./recyclarr.yml:/config/recyclarr.yml:ro  # tracked config from repo root
    restart: unless-stopped

  # --- Public network services ---
  # These are on the media network and not routed through the VPN.

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - drobo_tv:/data/tvshows
      - drobo_movies:/data/movies
    ports:
      - "8096:8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "991"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    networks:
      - media
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    networks:
      - media
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/maintainerr:/opt/data
    ports:
      - "6246:6246"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    networks:
      - media
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - media
    ports:
      - "3000:3000"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=192.168.0.181:3000
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY}

    restart: unless-stopped
