networks:
  media:
    driver: bridge
  # VPN-isolated services use network_mode: "service:vpn" instead of this network

# Media library + downloads live on two local USB HDDs plugged into Nookie:
#   /mnt/library   (HDD-A) -> movies + tv      — playback reads
#   /mnt/downloads (HDD-B) -> torrent scratch  — random writes, kept off the library spindle
# Split on purpose so torrent I/O never contends with playback; imports are copies, not
# hardlinks. Mounted on the host via fstab (scripts/setup-media-hdds.sh); bind-mounted below.

services:
  vpn:
    image: ghcr.io/qdm12/gluetun:latest
    container_name: vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - media
    ports:
      - "8090:8080"       # qBittorrent WebUI
      - "6881:6881"       # qBittorrent torrent port TCP
      - "6881:6881/udp"   # qBittorrent torrent port UDP
      - "9696:9696"       # Prowlarr
      - "8191:8191"       # FlareSolverr
      - "8000:8000"       # Gluetun HTTP API (for Homepage widget)
      - "8989:8989"       # Sonarr
      - "7878:7878"       # Radarr
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - BLOCK_IPV6=on
      - UPDATER_PERIOD=24h
      - VPN_PORT_FORWARDING=on
      - HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}
      - TZ=${TZ}
    volumes:
      - ./config/gluetun:/gluetun
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9999 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # --- VPN-isolated services ---
  # These share gluetun's network namespace — all traffic exits via the VPN tunnel.
  # They cannot be placed on named networks; ports are exposed via gluetun above.

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - QBT_PREFERENCES__WebUI__HostHeaderValidation=false
      - QBT_PREFERENCES__WebUI__CSRFProtection=false
    volumes:
      - ./config/qbittorrent:/config
      - /mnt/downloads:/data/downloads
    restart: unless-stopped

  # Polls gluetun's forwarded-port file directly every 60s rather than watching
  # its logs for a reconnect message — a reconnect log line only fires on a full
  # tunnel renegotiation, but the forwarded port can silently die (NAT-PMP lease
  # expiring without a tunnel drop, as happened 2026-08-21 -> 2026-09-04, unnoticed
  # for 2 weeks) with no such line ever logged. Polling the port file directly
  # catches both cases the same way. On any port change: restarts every container
  # sharing the VPN's network namespace (not just qBittorrent — they all go dark
  # the same way when vpn's netns is torn down) then pushes the new port into
  # qBittorrent. If the port stays down past RESTART_VPN_AFTER_MIN, restarts vpn
  # itself to force a fresh negotiation. Notifies Home Assistant either way — a
  # tunnel reset or an extended outage should never be silent. Not in the VPN
  # namespace itself — it drives everything via the Docker socket, and routes
  # its own HA calls through qBittorrent's container (which has curl and, via
  # vpn's bridge network, a route to the host) since this container has none.
  qbt-healer:
    image: docker:cli
    container_name: qbt-healer
    cpuset: "1-3"
    network_mode: none
    depends_on:
      - vpn
      - qbittorrent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint:
      - /bin/sh
      - -c
      - |
        POLL=60
        RESTART_VPN_AFTER_MIN=30
        HA_URL="http://192.168.0.181:8123"
        DEPENDENTS="qbittorrent sonarr radarr prowlarr flaresolverr recyclarr"
        LAST_PORT=""
        DOWN_SINCE=""

        notify() {
          docker exec qbittorrent curl -sf --max-time 5 -X POST -H 'Content-Type: application/json' \
            -d "{\"key\":\"$$1\",\"title\":\"$$2\",\"message\":\"$$3\"}" \
            "$$HA_URL/api/webhook/media_guard" >/dev/null 2>&1 || true
        }
        resolve() {
          docker exec qbittorrent curl -sf --max-time 5 -X POST -H 'Content-Type: application/json' \
            -d "{\"key\":\"$$1\"}" "$$HA_URL/api/webhook/media_guard_clear" >/dev/null 2>&1 || true
        }

        sync_and_restart() {
          port="$$1"
          for c in $$DEPENDENTS; do
            docker restart "$$c" >/dev/null 2>&1
          done
          i=0
          while [ $$i -lt 12 ]; do
            docker exec qbittorrent curl -s -m 5 http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1 && break
            i=$$((i+1)); sleep 5
          done
          docker exec qbittorrent curl -s -m 10 \
            -d "json={\"listen_port\":$$port,\"random_port\":false,\"upnp\":false}" \
            http://127.0.0.1:8080/api/v2/app/setPreferences >/dev/null 2>&1
          echo "[qbt-healer] restarted ($$DEPENDENTS), set listen_port=$$port"
          notify "vpn_resync" "Nookie: VPN reconnected" "New forwarded port $$port — restarted: $$DEPENDENTS"
        }

        echo "[qbt-healer] polling gluetun's forwarded port every $${POLL}s"
        while true; do
          port=$$(docker exec vpn cat /tmp/gluetun/forwarded_port 2>/dev/null)
          if [ -n "$$port" ] && [ "$$port" != "0" ]; then
            if [ -n "$$DOWN_SINCE" ]; then
              echo "[qbt-healer] port forwarding recovered: $$port"
              resolve vpn_port_down
              DOWN_SINCE=""
            fi
            if [ "$$port" != "$$LAST_PORT" ]; then
              sync_and_restart "$$port"
              LAST_PORT="$$port"
            fi
          else
            if [ -z "$$DOWN_SINCE" ]; then
              DOWN_SINCE=$$(date +%s)
              echo "[qbt-healer] port forwarding is down"
              notify "vpn_port_down" "Nookie: VPN port forwarding DOWN" "gluetun has no forwarded port — thin-swarm downloads will stall. Will restart the vpn container after $${RESTART_VPN_AFTER_MIN}m if still down."
            else
              elapsed_min=$$(( ($$(date +%s) - DOWN_SINCE) / 60 ))
              if [ "$$elapsed_min" -ge "$$RESTART_VPN_AFTER_MIN" ]; then
                echo "[qbt-healer] port forwarding down $${elapsed_min}m — restarting vpn"
                notify "vpn_port_down" "Nookie: VPN port forwarding still DOWN" "Down $${elapsed_min}m — restarting the vpn container to force a fresh negotiation"
                docker restart vpn >/dev/null 2>&1
                DOWN_SINCE=$$(date +%s)
              fi
            fi
          fi
          sleep "$$POLL"
        done
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - TZ=${TZ}
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/sonarr:/config
      - /mnt/downloads:/data/downloads
      - /mnt/library/tv:/data/tv
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/radarr:/config
      - /mnt/downloads:/data/downloads
      - /mnt/library/movies:/data/movies
    restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    # No PUID/PGID support — set the run-as user directly
    user: "${PUID}:${PGID}"
    # Share the VPN namespace so localhost:7878 reaches Radarr (same as the arr apps)
    network_mode: "service:vpn"
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - CRON_SCHEDULE=@daily
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      - ./config/recyclarr:/config            # app data / cached TRaSH guides (gitignored)
      - ./recyclarr.yml:/config/recyclarr.yml:ro  # tracked config from repo root
    restart: unless-stopped

  # --- Public network services ---
  # These are on the media network and not routed through the VPN.

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config/jellyfin:/config
      - /mnt/library/tv:/data/tvshows
      - /mnt/library/movies:/data/movies
    ports:
      - "8096:8096"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "991"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    networks:
      - media
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  maintainerr:
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    networks:
      - media
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/maintainerr:/opt/data
    ports:
      - "6246:6246"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    networks:
      - media
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - media
    ports:
      - "3000:3000"
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=${TZ}
      - HOMEPAGE_ALLOWED_HOSTS=192.168.0.181:3000
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_SEERR_API_KEY=${SEERR_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY}

    restart: unless-stopped
